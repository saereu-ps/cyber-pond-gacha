<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Pond - Gacha Catch</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    
    <button class="fullscreen-btn" id="fullscreen-btn" title="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
    </button>

    <div class="flash-overlay" id="flash-overlay"></div>
    
    <div class="water-background">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
    </div>
    
    <div class="container" id="main-container">
        <header>
            <h1>CYBER <span>POND</span></h1>
            <p>ตกไอเทมในสระน้ำไซเบอร์ ลุ้นรับรางวัลสุดล้ำ!</p>
        </header>

        <div class="pond-container">
            <div class="tractor-beam" id="tractor-beam"></div>
            
            <div class="caught-item" id="caught-item">
                <div class="mystery-orb" id="mystery-orb">?</div>
                <img src="" id="caught-img" alt="" style="display: none;">
            </div>
            
            <div class="water-surface">
                <div class="radar" id="radar"></div>
                <div class="ripple" id="ripple"></div>
            </div>
        </div>
        <button class="catch-btn" id="catch-btn">CATCH!</button>

        <div class="result-modal" id="result-modal">
            <div class="modal-content">
                <h2 id="result-title">ยินดีด้วย!</h2>
                <div class="result-image-container" id="result-image"></div>
                <p id="result-message">คุณได้รับรางวัล</p>
                <button class="close-btn" id="close-btn">ยืนยัน</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
